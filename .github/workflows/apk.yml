name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Poner el número de versión
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" www/index.html

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la web al proyecto Android
        run: npx cap sync android

      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plan2.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/plan2.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin el secreto KEYSTORE_BASE64 el APK se firma con una clave temporal: para actualizar habrá que desinstalar la versión anterior."
          fi

      - name: Compilar APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../plan-para-dos.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Plan para dos 1.0.${{ github.run_number }}
          body: Descarga **plan-para-dos.apk** e instálalo en tu Android.
          files: plan-para-dos.apk
          make_latest: true
